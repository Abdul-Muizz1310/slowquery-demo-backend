# Dependabot configuration.
#
# Two ecosystems:
#   - github-actions: the pinned action versions in .github/workflows/
#   - uv:             the uv.lock / pyproject.toml dependency set
#
# NOTE: slowquery-detective is pinned exactly (==0.1.0) in pyproject.toml because
# core/observability.py monkeypatches its v0.1.0 internals. It is ignored here so
# Dependabot cannot silently break the four compatibility shims; upgrades to that
# library have to be done by hand alongside the shims.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "slowquery-detective"
