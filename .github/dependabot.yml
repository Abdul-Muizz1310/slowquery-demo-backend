# Dependabot configuration.
#
# Two ecosystems:
#   - github-actions: the pinned action versions in .github/workflows/
#   - uv:             the uv.lock / pyproject.toml dependency set
#
# slowquery-detective is used through its public 0.2 API only (the shims that
# monkeypatched 0.1 are gone), so Dependabot may raise it within >=0.2,<0.3.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
