services:
  - type: web
    name: slowquery_demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    # No preDeployCommand: the free plan never runs one. docker-entrypoint.sh
    # migrates DATABASE_URL, DATABASE_URL_FAST and SLOWQUERY_STORE_URL at boot.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_FAST
        sync: false
      - key: BRANCH_CURRENT
        value: slow
      - key: SLOWQUERY_THRESHOLD_MS
        value: "100"
      - key: SLOWQUERY_SAMPLE_RATE
        value: "1.0"
      - key: SLOWQUERY_STORE_URL
        sync: false
      # NOTE: no NEON_API_KEY / NEON_PROJECT_ID. Branch switching is a pure
      # URL + engine swap between DATABASE_URL and DATABASE_URL_FAST (spec 06
      # rules the Neon API out of the request path on purpose), so the service
      # reads no Neon credentials at runtime.
      # Keep the LLM fallback OFF in production (matches DEVIATIONS §5).
      # When true, the app fails fast at boot unless OPENROUTER_API_KEY is
      # also set (see core/observability._build_llm_config), so flipping
      # this to "true" requires provisioning the key first.
      - key: LLM_FALLBACK_ENABLED
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        sync: false
      - key: OPENROUTER_MODEL_PRIMARY
        sync: false
      - key: CORS_ORIGINS
        value: "https://slowquery-dashboard-frontend.vercel.app,http://localhost:3000"
      # Contract v2 (spec 14). DEMO_MODE=true only lets a request *without* a
      # token through anonymous; it stays true until every minter (bastion,
      # the dashboard proxy) sends tokens, then flips to false.
      - key: DEMO_MODE
        value: "true"
      # Trusted keys: without one, protected routes answer 503.
      - key: BASTION_SIGNING_KEY_PUBLIC
        sync: false
      - key: BASTION_PUBLIC_KEY_URL
        sync: false
      - key: SLOWQUERY_FRONTEND_SIGNING_KEY_PUBLIC
        sync: false
      # Per-client cooldown (seconds) on the state-mutating endpoints
      # (branch switch, force-explain), enforced on top of the platform token.
      - key: DEMO_MUTATION_COOLDOWN_S
        value: "3"
      # Shared secret required to call the destructive force-explain
      # endpoint (and, when set, branch switch) even in demo mode. Unset
      # here on purpose: force-explain fails closed until an operator
      # provisions this in the Render dashboard.
      - key: DEMO_MUTATION_TOKEN
        sync: false
      - key: PORT
        value: "8000"
