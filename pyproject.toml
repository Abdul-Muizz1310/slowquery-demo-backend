[project]
name = "slowquery_demo"
version = "0.1.0"
description = "Live demo backend for slowquery-detective (seeded Neon dataset, slow/fast branch switching)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=26.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.18.5",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pyjwt[crypto]>=2.9",
    # Pinned exactly: core/observability.py monkeypatches this library's
    # v0.1.0 internals (hooks.attach, middleware.StoreWriter, the
    # add_event_handler compat stub). Any upstream release could silently
    # break those shims, so we do not float this dependency.
    "slowquery-detective==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "polyfactory>=2.18",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slowquery_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["slowquery_demo"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --cov-branch: a global line-coverage gate hides untaken branches, which is
# exactly where the negative-space guards live. Per-module floors are enforced
# separately (`make floors` / the `test` job in .github/workflows/ci.yml) because
# coverage.py's --fail-under is global only.
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "slow: slow end-to-end tests (CI-only, opt-in)",
    "integration: requires Testcontainers / real Postgres",
]

[dependency-groups]
dev = [
    "numpy>=2.4.4",
]
